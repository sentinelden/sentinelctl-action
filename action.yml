# SentinelDen Studio audit, the published GitHub Action wrapper for
# sentinelctl-linux. Customers consume this directly in their workflow
# YAML; they don't have to think about Docker / binaries / paths.
#
# Distribution: published to GitHub Marketplace as `sentinelden/sentinelctl-action`.
# Pinning recommended: `sentinelden/sentinelctl-action@v1` (major tag,
# moves with patches) or a full commit SHA (immutable, which is what makes
# the digests pinned below worth having).
#
# Example usage in customer's .github/workflows/audit.yml:
#
#   jobs:
#     audit:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: sentinelden/sentinelctl-action@v1
#           with:
#             binary: ./build/MyApp.ipa
#             severity-threshold: high
#         - uses: github/codeql-action/upload-sarif@v3
#           with:
#             sarif_file: sentinel-reports/sentinel-report.sarif
#

# Marketplace names must be unique. The original 'SentinelDen Studio Audit'
# listing was lost when this repository was recreated on 2026-09-25, and GitHub
# fails with a server error when the name is published again, so the Action is
# listed under this name. It only affects the Marketplace; `uses:` is unchanged.
name: 'SentinelDen Studio Audit Action'
# Marketplace hard-caps this at 125 characters and rejects the release if it
# is longer. Keep any future edit under that; the previous wording was 131.
description: 'Audit your iOS or Android build in CI. Findings land in GitHub code scanning via SARIF.'
author: 'Sentinel Den'
branding:
  icon: 'shield'
  # The nearest Marketplace colour to the Sentinel Amber brand gold.
  color: 'yellow'

inputs:
  binary:
    description: 'Path to the .ipa, .app, .apk, .aab or Mach-O binary to audit.'
    required: true
  severity-threshold:
    description: >
      Threshold for non-zero exit. One of: critical | high | medium | low | info.
      Default: high (any high+ finding fails the job).
    required: false
    default: 'high'
  rules:
    description: >
      Comma-separated rule-pack names (e.g., `masvs,hipaa,pci`).
      NOT IMPLEMENTED: this input is accepted and ignored. The audit always
      runs the built-in rules. Deliberately absent from the usage example
      above, because setting it changes nothing and reads as if it does.
    required: false
    default: 'baseline'
  rule-packs:
    description: >
      Newline- or comma-separated paths to signed rule-pack JSON files exported
      from Studio, passed to `sentinelctl --rules`. This is how a private rule
      pack reaches CI. Requires sentinelctl 1.7.0 or newer; an older binary
      rejects the flag. Empty (the default) runs the built-in pack only.
    required: false
    default: ''
  rule-pack-keys:
    description: >
      Newline- or comma-separated base64 Ed25519 public keys that a rule pack
      must be signed by, passed to `sentinelctl --rules-key`. With this set, an
      unsigned pack or one signed by any other key fails the job. Left empty,
      a pack signed by any key loads, and the action warns that nothing is
      pinned. Pin your own key here.
    required: false
    default: ''
  license-key:
    description: >
      Accepted so existing workflows keep working, and never enforced:
      sentinelctl runs at Community level, free by design. No key is validated,
      and the key is not sent anywhere.
    required: false
    default: ''
  output-dir:
    description: 'Directory to write report artifacts into.'
    required: false
    default: 'sentinel-reports'
  artifact-name:
    description: >
      Name of the uploaded reports artifact. Artifact names must be unique in a
      workflow run, so give each use its own name when one run audits more than
      one binary or the action runs in a matrix.
    required: false
    default: 'sentinel-reports'
  # NOTE: this default names a GitHub RELEASE TAG (cli-v<version>) in the
  # sentinelctl-action repo, holding the LINUX build. It is a separate
  # artifact line from the macOS universal binary on R2 / Homebrew, which
  # is why the two version numbers differ. Bump this ONLY in the same
  # change that publishes the matching cli-v<version> release: raise it
  # first and every consumer's next run 404s on the download.
  sentinelctl-version:
    description: 'sentinelctl-linux version. Use to pin against the action major.'
    required: false
    default: '1.14.0'

outputs:
  sarif-path:
    description: 'Path to the SARIF 2.1 report (suitable for github/codeql-action/upload-sarif).'
    value: ${{ steps.run.outputs.sarif-path }}
  sbom-path:
    description: 'Path to the CycloneDX 1.6 SBOM.'
    value: ${{ steps.run.outputs.sbom-path }}
  finding-count:
    description: 'Total findings discovered.'
    value: ${{ steps.run.outputs.finding-count }}

runs:
  using: composite
  steps:
    - name: Fetch sentinelctl
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.sentinelctl-version }}
      run: |
        set -euo pipefail
        # Linux only. Checked first because an Apple-silicon macOS runner
        # reports `arm64` from uname -m and would otherwise download the Linux
        # arm64 ELF, verify it, and fail only when it cannot execute.
        OS=$(uname -s)
        if [ "$OS" != "Linux" ]; then
          echo "::error::sentinelctl-action runs on Linux runners only; this runner is ${OS}."
          echo "::error::On macOS, install the CLI instead: brew install sentinelden/tap/sentinelctl"
          exit 1
        fi
        ARCH=$(uname -m)
        # From cli-v1.7.0 every release carries both architectures, built as
        # fully static binaries by Scripts/build-cli-linux.sh. cli-v1.6.0 and
        # earlier are x86_64 only, and the download failure below says so in
        # those words rather than sending the user off to check whether the
        # release exists.
        case "$ARCH" in
          x86_64)        ASSET="sentinelctl-amd64" ;;
          aarch64|arm64) ASSET="sentinelctl-arm64" ;;
          *)
            echo "::error::Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac
        # Validate BEFORE the version reaches a URL. Without this, a value like
        # "../../attacker/repo/releases/download/v1.0.0" retargets the download,
        # and because the .sha256 is derived from the same ${URL} prefix the
        # attacker supplies a matching checksum too. The integrity gate below
        # then prints "checksum verified" and executes their binary with the
        # job's secrets in scope. A bypassed control is worse than no control.
        #
        # The value is attacker-reachable without write access to the workflow
        # file: workflow_dispatch inputs, reusable-workflow and composite-action
        # parameters, and repository or organization variables all feed it.
        #
        # Same pattern as Scripts/promote-cli.sh, deliberately: the version that
        # can be published and the version that can be requested must agree.
        # Matched against the whole string: grep matches per line, so
        # "1.7.0<newline>anything" used to pass.
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::sentinelctl-version '${VERSION}' is not a plain X.Y.Z version."
          exit 1
        fi

        # A shape check alone is not enough: any older published version is
        # still well-formed, so whoever controls the input can silently pin the
        # CI gate to an engine that predates the detectors it is supposed to
        # run. Enforce a floor as well as a shape.
        MIN_VERSION="1.5.0"
        if [ "$(printf '%s\n%s\n' "$MIN_VERSION" "$VERSION" | sort -V | head -1)" != "$MIN_VERSION" ]; then
          echo "::error::sentinelctl-version '${VERSION}' is older than the minimum supported ${MIN_VERSION}."
          echo "::error::Older engines miss detectors this action's results are assumed to include."
          exit 1
        fi

        # Binaries are promoted to the PUBLIC action repo under a cli-v tag by
        # Scripts/promote-cli.sh. This previously pointed at
        # sentinelden/sentinelctl-linux, which does not exist and returns 404,
        # so this file had drifted from the action actually published.
        URL="https://github.com/sentinelden/sentinelctl-action/releases/download/cli-v${VERSION}/${ASSET}"

        # Stage under RUNNER_TEMP, not a fixed /tmp path. On a shared or
        # self-hosted runner, /tmp/sentinelctl is guessable and world-writable:
        # another local user or a concurrent job can pre-create it as a symlink
        # so curl writes through to a path they choose, or swap the file between
        # the checksum and the exec. RUNNER_TEMP is per-job and not shared.
        STAGE="${RUNNER_TEMP:-/tmp}/sentinelctl-${VERSION}-$$"
        rm -f "$STAGE" "$STAGE.sha256"
        if ! curl -sSLf -o "$STAGE" "$URL"; then
          echo "::error::Could not download sentinelctl ${VERSION} for ${ARCH}."
          echo "::error::Tried: ${URL}"
          if [ "$ASSET" = "sentinelctl-arm64" ] \
             && [ "$(printf '%s\n%s\n' 1.7.0 "$VERSION" | sort -V | head -1)" != "1.7.0" ]; then
            echo "::error::Releases up to and including cli-v1.6.0 published x86_64 only."
            echo "::error::Use sentinelctl-version 1.7.0 or newer on an arm64 runner,"
            echo "::error::or run this job on an x86_64 runner (ubuntu-latest is x86_64)."
          else
            echo "::error::Check that a release tagged cli-v${VERSION} exists with that asset."
          fi
          exit 1
        fi

        # Expected digests, committed HERE rather than trusted from the release.
        #
        # The .sha256 published beside the binary comes from the same place the
        # binary does, so anyone who can write one can write the other: the
        # run-time check below catches corruption and CDN errors, not an
        # attacker with release-write access. A digest committed in this file is
        # covered by the consumer's own action pin (uses: ...@<sha>), so a later
        # substitution of the release asset no longer matches.
        #
        # Honest limit: these values were read from the published releases at
        # the time this table was written, and each was confirmed against the
        # binary actually served. That freezes today's artifact; it is not an
        # independent root of trust. Signing the release with a vendor key, and
        # verifying that here, is the durable fix.
        # Keyed by version AND asset: the two architectures are different
        # binaries with different digests, so a version-only table would pin
        # the amd64 digest onto an arm64 download and refuse every arm64 run.
        case "${VERSION}:${ASSET}" in
          1.8.5:sentinelctl-amd64) PINNED=98737f4dc0cc1e12e2f13f42ad24c1d288610e2e289530b19b02d532ecce1b78 ;;
          1.8.5:sentinelctl-arm64) PINNED=4e893b74e1cf95f7e10daf6f181fb43917aca9c992a6477699cc47d9d128fd5b ;;
          1.9.0:sentinelctl-amd64) PINNED=8f10e80561c3919f927264a6827444fef4532d607c3e6c979d5af37a3ec558a5 ;;
          1.9.0:sentinelctl-arm64) PINNED=c9a0d066c15efa030680cfd9fd176eca7f2b8bcf68bfd836527db2b3427dd6d8 ;;
          1.10.1:sentinelctl-amd64) PINNED=dca2f9c85809bdfecd5aa1b9baaba2a2343951eb78a92baf7324745f5e69ea6e ;;
          1.10.1:sentinelctl-arm64) PINNED=a91e7f06d4ed2115e1fe87331fcf95288fb4a51f15dff1015fab47ef066a3aa2 ;;
          1.12.0:sentinelctl-amd64) PINNED=005d4d9cc702da67e450b586d8250652d48b4b3a3879639bdfdb40d1e9831fc7 ;;
          1.12.0:sentinelctl-arm64) PINNED=a71ec0d01e878017e4ea31c85d34fa3200c5373d33b2944da548d2d14b247090 ;;
          1.11.0:sentinelctl-amd64) PINNED=0115569b939b6be13463bf71ae8400ee7a8aeac87e4ad0ae6a33b48023dc246b ;;
          1.11.0:sentinelctl-arm64) PINNED=ac3182d806043a57107b14eb7a344b27a6576ee5d053eb1b4757c6df6d284cc7 ;;
          1.13.0:sentinelctl-amd64) PINNED=bf58c5f2b3a7e51fce78f23f790c633aa8a755ed6d5acf5d92b5ee316b6157b4 ;;
          1.13.0:sentinelctl-arm64) PINNED=0c07da2ed501191db505e2532919351ae8791026eb42ba3696054fe51e85d8d4 ;;
          1.14.0:sentinelctl-amd64) PINNED=cfe53955ee2ec2685fa86d24704ec1f79d42d182e8b8f7698236d12bb64e77f6 ;;
          1.14.0:sentinelctl-arm64) PINNED=f44ce4b2273043de772d4a434b013bd7ea5dd4dfd67ddc874b33b20f842bdd40 ;;
          1.10.2:sentinelctl-amd64) PINNED=02f9111209cc9b226876c989166d335901186b44054c31c321299720c7e04c78 ;;
          1.10.2:sentinelctl-arm64) PINNED=7fad812b480cca6bd03162610d19805706764f9cdad38a30c5089b260482c037 ;;
          1.10.0:sentinelctl-amd64) PINNED=09ea43273ee6a49fd6b5728d4326d3fb56e60dbba5ec6391e874d2e52e39fa50 ;;
          1.10.0:sentinelctl-arm64) PINNED=d2c6fc2e92f1213ca4e771f808aacc7842e0db26726281300e1ece62efcc2545 ;;
          1.9.1:sentinelctl-amd64) PINNED=43a2dcec99b7b41e74529cc05319a647c3667992ab94072ad8debb1ae4dbe096 ;;
          1.9.1:sentinelctl-arm64) PINNED=a286872e4e42e21e406abf955c31fc1d70244595857824f42c26e52b05e0d34d ;;
          1.8.4:sentinelctl-amd64) PINNED=565a37fb2b52163a39fa32d0f3bbc69d35579b76ed871eaf257d232ecf24a621 ;;
          1.8.4:sentinelctl-arm64) PINNED=0d5f2f6315b7fdfbef89acd49a233c06635a8f74c1711fabbd47d9499b013b78 ;;
          1.7.2:sentinelctl-amd64) PINNED=05991c22982af3c8baeb63a4874351d9664fa2a77a4ecd17435ab01c20e29370 ;;
          1.7.2:sentinelctl-arm64) PINNED=fbce17e8ca1921830eff924211b349a19e034135a1b76e8e1ce86642041d512f ;;
          1.7.1:sentinelctl-amd64) PINNED=5682ac2dc393e13d9a2928018a53332cf64bab2ef927696efbd42fada41391a1 ;;
          1.7.1:sentinelctl-arm64) PINNED=1fb5479ee07867b0121776cb8653b95bf1bd3764bbb2e9fdff4ba9c32d35d1ec ;;
          1.7.0:sentinelctl-amd64) PINNED=3f14d7a346ec3f71deadf8d1112a10016df2e88c6a1520604b63158bec7fb058 ;;
          1.7.0:sentinelctl-arm64) PINNED=ad552820611f7933d1a2664ca3d646b053121a00030e74d8c39c112475720391 ;;
          1.6.0:sentinelctl-amd64) PINNED=970cd4a33c7d431bd48224d98484a7a6e17ed73cee3ed29283e84b2b03a2a5ef ;;
          1.5.0:sentinelctl-amd64) PINNED=f4d5fddc596a984e35aed048cd20e6301c47c9cf240e614df079636c42eeb0af ;;
          *)                       PINNED="" ;;
        esac

        # Integrity check against the checksum published beside the binary.
        # This was previously a TODO that fetched a .sig and never verified
        # it, which is worse than no check: it looks verified and is not.
        # SHA-256 is what the release workflow actually publishes, so this
        # verifies something that exists rather than something aspirational.
        if curl -sSLf -o "$STAGE.sha256" "${URL}.sha256"; then
          EXPECTED=$(grep -oE '[a-f0-9]{64}' "$STAGE.sha256" | head -1)
          ACTUAL=$(sha256sum "$STAGE" | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::Published checksum file contained no SHA-256."
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch. Refusing to execute the download."
            echo "::error::expected $EXPECTED"
            echo "::error::actual   $ACTUAL"
            exit 1
          fi
          if [ -n "$PINNED" ] && [ "$PINNED" != "$ACTUAL" ]; then
            echo "::error::sentinelctl ${VERSION} does not match the digest pinned in this action."
            echo "::error::pinned $PINNED"
            echo "::error::actual $ACTUAL"
            echo "::error::The published release asset has changed since this action version was cut."
            exit 1
          fi
          if [ -n "$PINNED" ]; then
            echo "sentinelctl ${VERSION} verified against the digest pinned in this action."
          else
            echo "::warning::No pinned digest for ${VERSION} in this action version; verified only"
            echo "::warning::against the checksum published beside the binary, which shares its origin."
          fi
        else
          # Fail rather than warn. This action runs arbitrary downloaded code
          # against a customer's build artifact inside their CI; silently
          # skipping integrity verification is not an acceptable default.
          echo "::error::No published checksum at ${URL}.sha256. Refusing to run an unverified binary."
          exit 1
        fi

        chmod +x "$STAGE"
        echo "sentinelctl-path=$STAGE" >> "$GITHUB_OUTPUT"

    - name: Run audit
      id: run
      shell: bash
      env:
        SENTINELCTL: ${{ steps.install.outputs.sentinelctl-path }}
        SENTINEL_LICENSE_KEY: ${{ inputs.license-key }}
        BINARY: ${{ inputs.binary }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        THRESHOLD: ${{ inputs.severity-threshold }}
        RULE_PACKS: ${{ inputs.rule-packs }}
        RULE_PACK_KEYS: ${{ inputs.rule-pack-keys }}
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR"
        SARIF="$OUTPUT_DIR/sentinel-report.sarif"
        SBOM="$OUTPUT_DIR/sentinel-sbom.cyclonedx.json"
        JSON="$OUTPUT_DIR/sentinel-report.json"
        MD="$OUTPUT_DIR/sentinel-report.md"

        # Rule packs and pinned keys are built into an argv array rather than
        # a string. Note the '%s\n': without the trailing newline `read`
        # returns non-zero on the final entry and the loop silently drops it,
        # which made a single-pack input load nothing AND skipped the
        # file-exists check on it, failing open on a typo'd path.
        # A single pack is the common case, so this looked like it worked.
        # a path is user-supplied data, and word-splitting one would
        # let a space in a filename become a second argument. Commas and
        # newlines both separate, so a single-line workflow input and a YAML
        # block scalar behave the same.
        EXTRA=()
        PACKS=0
        KEYS=0
        # Entries are trimmed: the documented comma-separated form
        # ("./a.json, ./b.json") otherwise keeps the space after the comma, so
        # every entry but the first was passed as " ./b.json": a path that
        # fails the file check, and a --rules-key that silently never matches.
        trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
        while IFS= read -r pack; do
          pack="$(trim "$pack")"
          [ -n "$pack" ] || continue
          if [ ! -f "$pack" ]; then
            echo "::error::rule-packs: no such file: $pack"
            exit 1
          fi
          EXTRA+=(--rules "$pack")
          PACKS=$((PACKS + 1))
        done < <(printf '%s\n' "$RULE_PACKS" | tr ',' '\n')
        while IFS= read -r key; do
          key="$(trim "$key")"
          [ -n "$key" ] || continue
          EXTRA+=(--rules-key "$key")
          KEYS=$((KEYS + 1))
        done < <(printf '%s\n' "$RULE_PACK_KEYS" | tr ',' '\n')
        # An empty rule-pack-keys is easy to get by accident: an unset or
        # misspelled repository variable expands to "". Say so, because the
        # CLI accepts a pack signed by any key without a word in that case.
        if [ "$PACKS" -gt 0 ] && [ "$KEYS" -eq 0 ]; then
          echo "::warning::rule-packs is set but rule-pack-keys is empty, so a pack signed by any key is accepted. Pin your signing key."
        fi
        if [ ${#EXTRA[@]} -gt 0 ]; then
          echo "Passing ${#EXTRA[@]} extra argument(s) for rule packs and pinned keys."
        fi

        EXIT=0
        "$SENTINELCTL" audit "$BINARY" \
          --min "$THRESHOLD" \
          --sarif "$SARIF" \
          --sbom "$SBOM" \
          --json "$JSON" \
          --markdown "$MD" \
          ${EXTRA[@]+"${EXTRA[@]}"} \
          || EXIT=$?

        # Surface artifact paths for downstream steps regardless of
        # the audit's exit code: failing the build is the action's
        # job, but the report itself is still useful.
        echo "sarif-path=$SARIF" >> "$GITHUB_OUTPUT"
        echo "sbom-path=$SBOM"   >> "$GITHUB_OUTPUT"

        # `findingCount` is a real top-level key in the CLI's JSON report,
        # confirmed against an actual run. Parsed with jq (present on all
        # GitHub-hosted runners) rather than a grep over raw JSON, because the
        # grep would also match the string inside a finding's description and
        # would report 0 forever if the key were ever renamed.
        if [ -f "$JSON" ] && command -v jq >/dev/null 2>&1; then
          COUNT=$(jq -r '.findingCount // (.findings | length) // 0' "$JSON")
        elif [ -f "$JSON" ]; then
          COUNT=$(grep -o '"findingCount"[[:space:]]*:[[:space:]]*[0-9]*' "$JSON" \
                  | grep -oE '[0-9]+$' | head -1 || echo 0)
        else
          echo "::warning::No JSON report was produced; reporting 0 findings."
          COUNT=0
        fi
        echo "finding-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "sentinelctl found ${COUNT} finding(s); threshold is ${THRESHOLD}."

        # Re-raise the original exit code so the workflow status
        # reflects the audit verdict.
        exit "$EXIT"

    - name: Upload reports as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
